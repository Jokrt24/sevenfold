<style>
/* 七重 SEVENFOLD — 样式 */
:root {
  --bg: #07070A;
  --bg2: #0B0B0E;
  --ink: #E8E3DA;
  --ink2: #9A948A;
  --ink3: #6E6960;
  --gold: #C6A664;
  --goldDim: rgba(198, 166, 100, 0.42);
  --blood: #C05A45;
  --bloodDeep: #A04334;
  --crimson: #A0473D;
  --line: rgba(232, 227, 218, 0.10);
  --line2: rgba(232, 227, 218, 0.055);
  --serif: "Noto Serif SC", "Source Han Serif SC", "Songti SC", STSong, "SimSun", serif;
  --sans: "Microsoft YaHei UI", "PingFang SC", "Noto Sans SC", "Source Han Sans SC", sans-serif;
  --latin: "Cinzel", Georgia, "Times New Roman", serif;
  --num: "Cormorant Garamond", Georgia, serif;
  --w: 1040px;
  --ease: cubic-bezier(.2, .7, .2, 1);
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
.vScore b, .beamNums b, .sc, .barCount, .rk, .axisNum, .signals li::before, .vAlt b, .fVal {
  font-variant-numeric: lining-nums tabular-nums;
  font-feature-settings: "lnum" 1, "tnum" 1;
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.9;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow-x: hidden;
}
body::before {
  content: "";
  position: fixed; inset: 0;
  background: radial-gradient(120% 80% at 50% -10%, rgba(198,166,100,.055), transparent 60%),
              radial-gradient(90% 70% at 50% 110%, rgba(140,58,52,.05), transparent 60%);
  pointer-events: none; z-index: 0;
}
.grain {
  position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: .032;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");
}
.skip {
  position: absolute; left: -9999px; top: 0; background: var(--gold); color: #0A0A0C;
  padding: 12px 20px; z-index: 99;
}
.skip:focus { left: 12px; top: 12px; }

#app { position: relative; z-index: 2; }
.view {
  max-width: var(--w);
  margin: 0 auto;
  padding: clamp(20px, 4vw, 40px) clamp(20px, 5vw, 56px) 80px;
  min-height: 100vh;
  display: flex; flex-direction: column;
}
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
h1, h2, h3, p, ul, ol, table { margin: 0; }
ul, ol { padding: 0; list-style: none; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
[tabindex="-1"]:focus, [tabindex="-1"]:focus-visible { outline: none; }
.sr {
  position: absolute !important; width: 1px; height: 1px; overflow: hidden;
  clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
}

.kicker {
  font-family: var(--latin);
  font-size: 11px; letter-spacing: .34em; text-transform: uppercase;
  color: var(--gold); opacity: .92;
}
.tiny { font-size: 12px; color: var(--ink3); letter-spacing: .02em; line-height: 1.8; }
.note { font-size: 13px; color: var(--ink3); line-height: 1.85; margin-top: 18px; }
.link {
  display: inline-block; font-size: 13px; letter-spacing: .08em; color: var(--ink2);
  border-bottom: 1px solid var(--line); padding-bottom: 2px; transition: color .3s var(--ease), border-color .3s var(--ease);
}
.link:hover, .link:focus-visible { color: var(--gold); border-color: var(--goldDim); }
.link.quiet { color: var(--ink3); }

/* ───── 按钮 ───── */
.btn {
  display: inline-block; border: 1px solid var(--goldDim); color: var(--ink);
  padding: 17px 40px; font-size: 14px; letter-spacing: .22em;
  transition: background .35s var(--ease), border-color .35s var(--ease), color .35s var(--ease);
}
.btn:hover, .btn:focus-visible { background: rgba(198,166,100,.10); border-color: var(--gold); }
.btnGhost {
  display: inline-block; border: 1px solid var(--line); color: var(--ink2);
  padding: 14px 26px; font-size: 13px; letter-spacing: .16em;
  transition: color .3s var(--ease), border-color .3s var(--ease);
}
.btnGhost:hover, .btnGhost:focus-visible { color: var(--ink); border-color: var(--goldDim); }
.btnGhost[disabled] { opacity: .32; cursor: default; }
.btnSmall {
  border: 1px solid var(--line); padding: 10px 18px; font-size: 12px; letter-spacing: .12em;
  color: var(--ink2); transition: color .3s var(--ease), border-color .3s var(--ease);
}
.btnSmall:hover { color: var(--gold); border-color: var(--goldDim); }

/* ───── 封面 ───── */
.cover { position: relative; display: grid; place-items: center; min-height: 100vh; text-align: center; overflow: hidden; }
.coverDisc { position: absolute; inset: 0; display: grid; place-items: center; opacity: .2; pointer-events: none; z-index: 0; }
.coverDisc svg { width: min(84vh, 84vw); height: auto; display: block; }
.coverDisc line, .coverDisc circle { fill: none; stroke: var(--gold); stroke-width: .35; }
.coverInner { position: relative; z-index: 1; display: grid; justify-items: center; }
@media (prefers-reduced-motion: no-preference) {
  .coverDisc svg { animation: spin 240s linear infinite; }
  .coverInner { animation: coverIn 1.2s var(--ease) both; }
  .coverStart::after { animation: haloBreathe 5.5s ease-in-out infinite; }
}
@keyframes coverIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes haloBreathe { 0%, 100% { opacity: .25; transform: scale(1); } 50% { opacity: .7; transform: scale(1.04); } }
.coverKicker { font-family: var(--latin); font-size: 11px; letter-spacing: .52em; color: var(--goldDim); }
.coverTitle {
  margin: 26px 0 12px; display: grid; justify-items: center;
  font-family: var(--serif); font-weight: 400;
  font-size: clamp(52px, 10vw, 124px); line-height: 1.22; letter-spacing: .18em;
}
.coverTitle span { font-size: .26em; color: var(--ink3); letter-spacing: .42em; line-height: 2.4; }
.coverLatin { font-family: var(--latin); font-size: 10px; letter-spacing: .5em; color: var(--ink3); }
.coverLede { margin-top: 34px; font-family: var(--serif); font-size: clamp(14px, 1.7vw, 17px); line-height: 2; color: var(--ink2); }
.coverStart {
  position: relative; margin-top: 52px;
  width: clamp(112px, 13vw, 138px); height: clamp(112px, 13vw, 138px);
  border-radius: 50%; border: 1px solid var(--goldDim);
  display: grid; place-items: center;
  font-family: var(--serif); font-size: 15px; letter-spacing: .3em; color: var(--ink);
  transition: color .4s var(--ease), border-color .4s var(--ease), transform .4s var(--ease);
}
.coverStart::after {
  content: ''; position: absolute; inset: -9px; border-radius: 50%;
  border: 1px solid rgba(198,166,100,.5); opacity: .3; pointer-events: none;
}
.coverStart:hover, .coverStart:focus-visible { color: var(--gold); border-color: var(--gold); transform: scale(1.02); }
.coverHint { margin-top: 20px; font-size: 10.5px; letter-spacing: .36em; color: var(--ink3); opacity: .55; }
@media (max-width: 520px) {
  .coverTitle { letter-spacing: .12em; }
  .coverDisc { opacity: .16; }
}

/* ───── 首页 ───── */
.home { justify-content: space-between; position: relative; }
.ornament {
  position: absolute; right: -14%; top: 44%; width: min(62vw, 760px);
  transform: translateY(-50%); opacity: .075; pointer-events: none; z-index: -1;
}
.ornament svg { width: 100%; height: auto; display: block; }
.ornament line { stroke: var(--gold); stroke-width: .6; }
.ornament circle { fill: none; stroke: var(--gold); stroke-width: .6; }
.ornament circle:last-child { fill: var(--gold); stroke: none; }
@media (prefers-reduced-motion: no-preference) {
  .ornament svg { animation: spin 180s linear infinite; }
}
@keyframes spin { to { transform: rotate(360deg); } }
.homeTop { display: flex; align-items: center; gap: 14px; }
.mark {
  font-family: var(--latin); font-size: 15px; color: var(--gold);
  border: 1px solid var(--goldDim); width: 34px; height: 34px;
  display: grid; place-items: center; letter-spacing: 0;
}
.brand { font-family: var(--serif); font-size: 14px; letter-spacing: .3em; color: var(--ink2); }
.brand em { font-family: var(--latin); font-style: normal; font-size: 10px; letter-spacing: .3em; color: var(--ink3); margin-left: 10px; }
.homeBody { padding: clamp(28px, 7vh, 92px) 0 clamp(24px, 5vh, 56px); }
.display {
  font-family: var(--serif); font-weight: 400;
  font-size: clamp(46px, 9.2vw, 116px); line-height: 1.04; letter-spacing: .04em;
  margin: 20px 0 24px;
}
.display .thin { font-size: .42em; color: var(--ink3); vertical-align: .28em; padding: 0 .12em; letter-spacing: .2em; }
.lede { font-family: var(--serif); font-size: clamp(17px, 2.2vw, 22px); line-height: 2; color: var(--ink2); }
.meta { margin-top: 26px; font-size: 12.5px; letter-spacing: .18em; color: var(--ink3); }

/* 两种探索入口：不设框，分隔线向右淡出，不切到背后的星盘 */
.paths { position: relative; display: grid; grid-template-columns: 1fr; gap: 0; margin-top: 30px; max-width: 560px; }
.paths::before {
  content: ''; position: absolute; left: 0; top: 0; width: 62%; height: 1px;
  background: linear-gradient(90deg, var(--line2), transparent);
}
.path {
  position: relative;
  display: grid; gap: 5px; align-content: start;
  padding: 20px 4px 22px 0;
  color: var(--ink); text-decoration: none;
  transition: color .3s, padding-left .3s;
}
.path::after {
  content: ''; position: absolute; left: 0; bottom: 0; width: 62%; height: 1px;
  background: linear-gradient(90deg, var(--line2), transparent);
}
.path:hover, .path:focus-visible { padding-left: 14px; }
.path:hover::before, .path:focus-visible::before { opacity: 1; }
.path::before {
  content: ''; position: absolute; left: 0; top: 18px; bottom: 18px; width: 1px;
  background: var(--gold); opacity: 0; transition: opacity .3s;
}
.pathDeep::before { background: var(--blood); }
.path:hover .pathTitle, .path:focus-visible .pathTitle { color: var(--gold); }
.pathDeep:hover .pathTitle, .pathDeep:focus-visible .pathTitle { color: var(--blood); }
.pathKicker { font-size: 11px; letter-spacing: .34em; color: var(--gold); }
.pathDeep .pathKicker { color: var(--blood); }
.pathTitle { font-family: var(--serif); font-size: clamp(20px, 2.4vw, 26px); letter-spacing: .06em; transition: color .3s; }
.pathMeta { font-size: 12px; line-height: 1.9; color: var(--ink3); letter-spacing: .04em; }
.pathGo { margin-top: 6px; font-size: 12px; letter-spacing: .2em; color: var(--ink2); }

.homeActions { display: flex; flex-wrap: wrap; align-items: center; gap: 22px 28px; margin-top: 48px; }
.homeFoot { border-top: 1px solid var(--line2); padding-top: 22px; }

/* 反馈与署名 */
.footRow { display: flex; align-items: baseline; justify-content: space-between; gap: 14px 24px; flex-wrap: wrap; }
.signature { font-family: var(--sans); font-size: 11.5px; letter-spacing: .14em; color: var(--ink3); }
.fbWrap { margin-left: auto; position: relative; }
.fbBtn {
  font-size: 12px; letter-spacing: .22em; color: var(--ink2); padding: 6px 2px;
  border-bottom: 1px solid transparent;
  transition: color .3s var(--ease), border-color .3s var(--ease);
}
.fbBtn:hover, .fbBtn:focus-visible, .fbBtn[aria-expanded="true"] { color: var(--gold); border-bottom-color: var(--goldDim); }
.fbPanel {
  position: absolute; right: 0; top: calc(100% + 12px); z-index: 6;
  width: 320px; max-width: calc(100vw - 48px);
  padding: 22px 22px 18px;
  background: rgba(10,10,13,.985);
  border: 1px solid var(--line);
  box-shadow: 0 24px 70px rgba(0,0,0,.66);
}
.fbPanel[hidden] { display: none; }
.fbTitle { font-family: var(--serif); font-size: 18px; letter-spacing: .12em; }
.fbText { font-size: 13px; line-height: 1.95; color: var(--ink2); margin-top: 8px; }
.fbLine { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; font-size: 12px; letter-spacing: .1em; color: var(--ink3); margin-top: 14px; }
.footRow .fbLine { margin-top: 0; }
.fbMail {
  font-family: var(--sans); font-size: 13px; letter-spacing: .02em; color: var(--gold);
  text-transform: none; text-decoration: none;
  border-bottom: 1px solid var(--goldDim); padding-bottom: 2px;
}
.fbMail:hover { color: var(--ink); border-bottom-color: var(--gold); }
.fbCopy { font-size: 11px; letter-spacing: .16em; color: var(--ink3); border-bottom: 1px solid var(--line2); padding-bottom: 1px; }
.fbCopy:hover, .fbCopy:focus-visible { color: var(--ink); border-bottom-color: var(--goldDim); }
@media (max-width: 700px) {
  .fbPanel { right: -6px; width: calc(100vw - 44px); }
}

/* ───── 答题 ───── */
.test { justify-content: flex-start; }
.bar {
  display: flex; align-items: baseline; justify-content: space-between; gap: 16px;
  padding-bottom: 18px; font-size: 12px; letter-spacing: .2em; color: var(--ink3);
}
.barBack { font-size: 18px; color: var(--ink2); line-height: 1; padding: 4px 8px 4px 0; }
.barBack:hover { color: var(--gold); }
.barAct { color: var(--ink2); letter-spacing: .3em; }
.barCount { font-family: var(--num); font-size: 15px; letter-spacing: .12em; color: var(--ink2); }
.barCount i { font-style: normal; color: var(--ink3); font-size: 12px; }
.progress { height: 1px; background: var(--line2); position: relative; }
.progress i { display: block; height: 1px; background: var(--gold); opacity: .75; transition: width .45s var(--ease); }

.qWrap { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: clamp(28px, 6vh, 72px) 0; max-width: 760px; }
.qKicker { font-size: 11px; letter-spacing: .3em; color: var(--ink3); margin-bottom: 26px; }
.qText {
  font-family: var(--serif); font-weight: 400; font-size: clamp(21px, 3.2vw, 32px);
  line-height: 1.75; letter-spacing: .02em; margin-bottom: clamp(32px, 5vh, 52px);
}
.qScenario { font-size: clamp(18px, 2.6vw, 25px); line-height: 1.9; }
.opts { border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; }
.opt {
  position: relative; display: flex; align-items: center; gap: 18px;
  padding: 19px 4px; border-bottom: 1px solid var(--line2);
  cursor: pointer; transition: background .25s var(--ease), border-color .25s var(--ease);
}
.opt:first-of-type { border-top: 1px solid var(--line2); }
.opt::before {
  content: ""; position: absolute; left: -14px; top: 12%; bottom: 12%; width: 1px;
  background: var(--gold); transform: scaleY(0); transform-origin: center;
  transition: transform .3s var(--ease);
}
.opt:hover { background: rgba(232,227,218,.028); }
.opt:hover::before, .opt:focus-within::before { transform: scaleY(1); }
.opt input {
  position: absolute; opacity: 0; width: 1px; height: 1px;
}
.optKey {
  font-family: var(--latin); font-size: 12px; color: var(--ink3);
  width: 22px; flex: 0 0 22px; text-align: center; letter-spacing: 0;
  transition: color .25s var(--ease);
}
.optBody { font-size: 15.5px; line-height: 1.7; color: #C4BEB3; transition: color .25s var(--ease); }
.optsText .opt { padding: 20px 4px; align-items: flex-start; }
.optsText .optBody { font-size: 15px; }
.opt:hover .optBody { color: var(--ink); }
.opt.on { background: rgba(198,166,100,.055); }
.opt.on::before { transform: scaleY(1); }
.opt.on .optKey { color: var(--gold); }
.opt.on .optBody { color: var(--ink); }
.opt input:focus-visible + .optKey { outline: 2px solid var(--gold); outline-offset: 4px; }
.testFoot {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  border-top: 1px solid var(--line2); padding-top: 22px; padding-left: 56px;
}
.hint { font-size: 12px; letter-spacing: .16em; color: var(--ink3); }

/* ───── 文档页 ───── */
.doc { max-width: 720px; padding: clamp(24px, 6vh, 64px) 0 40px; }
.docTitle { font-family: var(--serif); font-weight: 400; font-size: clamp(28px, 4.4vw, 42px); letter-spacing: .04em; margin: 22px 0 26px; }
.docLead { font-family: var(--serif); font-size: 17px; line-height: 2; color: var(--ink2); margin-bottom: 10px; }
.docH { font-family: var(--serif); font-weight: 400; font-size: 18px; letter-spacing: .08em; color: var(--ink); margin: 38px 0 12px; padding-top: 20px; border-top: 1px solid var(--line2); }
.docP { font-size: 15px; line-height: 2; color: var(--ink2); }
.srclist { margin-top: 18px; }
.srclist li { font-size: 13px; line-height: 1.9; color: var(--ink2); padding: 12px 0; border-bottom: 1px solid var(--line2); }
.srclist a { border-bottom: 1px solid var(--line); }
.srclist a:hover { color: var(--gold); border-color: var(--goldDim); }

/* ───── 错误 ───── */
.error { justify-content: center; }
.errBox { max-width: 620px; padding: 60px 0; }

/* ───── 结果 ───── */
.result { max-width: 900px; }
.card {
  padding: clamp(34px, 6vw, 64px) 0;
  border-top: 1px solid var(--line2);
}
.verdict { border-top: 0; padding-top: clamp(20px, 4vh, 40px); position: relative; }
.vName {
  font-family: var(--serif); font-weight: 400;
  font-size: clamp(72px, 15vw, 152px); line-height: 1; letter-spacing: .06em;
  margin: 18px 0 6px;
}
.vLatin { font-family: var(--latin); font-size: clamp(12px, 1.6vw, 15px); letter-spacing: .46em; color: var(--gold); }
.vEssence { font-family: var(--serif); font-size: clamp(18px, 2.6vw, 24px); line-height: 1.9; color: var(--ink2); margin-top: 26px; }
.vScore { margin-top: 26px; display: flex; align-items: baseline; gap: 12px; }
.vScore b { font-family: var(--num); font-weight: 300; font-size: 54px; line-height: 1; color: var(--ink); letter-spacing: .02em; }
.vScore span { font-size: 12px; letter-spacing: .14em; color: var(--ink3); }
.vAlt {
  margin-top: 30px; padding-top: 18px; border-top: 1px solid var(--line2);
  display: flex; flex-direction: column; gap: 6px;
  font-size: 12.5px; letter-spacing: .04em; color: var(--ink3);
}
.vAlt b { font-family: var(--num); font-weight: 300; font-size: 15px; color: var(--ink2); margin-left: 4px; }
.vAlt .vSub { color: rgba(232,227,218,.44); }

.sec {
  font-family: var(--serif); font-weight: 400; font-size: 15px; letter-spacing: .28em;
  color: var(--ink); margin-bottom: 26px; display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
}
.sec span { font-family: var(--latin); font-size: 10px; letter-spacing: .34em; color: var(--ink3); }

.banner { padding: 28px 0; border-top: 1px solid var(--line2); }
.banner h3 { font-family: var(--serif); font-weight: 400; font-size: 15px; letter-spacing: .2em; color: var(--gold); margin-bottom: 10px; }
.banner p { font-size: 14px; line-height: 2; color: var(--ink2); }

/* 天平 */
.beam { width: 100%; max-width: 520px; margin: 0 auto 10px; display: block; overflow: visible; }
.beamSeg { stroke-width: 1.5; }
.pivot { fill: var(--gold); }
.pillar { stroke: rgba(232,227,218,.16); stroke-width: 1; }
.floor { stroke: rgba(232,227,218,.16); stroke-width: 1; }
.thread { stroke: rgba(232,227,218,.22); stroke-width: 1; }
.thread.thL { stroke: rgba(192,90,69,.5); }
.thread.thR { stroke: rgba(198,166,100,.5); }
.pan { fill: none; stroke: rgba(232,227,218,.55); stroke-width: 1.2; }
.pan.panL { stroke: rgba(192,90,69,.62); }
.pan.panR { stroke: rgba(198,166,100,.62); }
.beamNums { display: flex; justify-content: center; gap: 56px; margin-top: 14px; }
.beamNums div { text-align: center; }
.beamNums b { display: block; font-family: var(--num); font-weight: 300; font-size: 38px; line-height: 1.2; }
.beamNums span { font-size: 11px; letter-spacing: .28em; color: var(--ink3); }

/* 十四芒星 */
.chartCard { text-align: left; }
.chart { width: 100%; max-width: 660px; margin: 4px auto 0; display: block; }
.ring { fill: none; stroke: rgba(232,227,218,.07); stroke-width: 1; }
.horizon { stroke: rgba(198,166,100,.2); stroke-width: 1; stroke-dasharray: 2 6; }
.spokeBase { stroke: rgba(232,227,218,.06); stroke-width: 1; }
.spokeBar { stroke-width: 5; stroke-linecap: round; }
.spokeBar.sin { stroke-width: 6; }
.spokeBar.vir { stroke-width: 4.5; }
.axisLabel { font-family: var(--serif); font-size: 18px; fill: #C9C3B8; letter-spacing: .06em; }
.axisNum { font-family: var(--num); font-size: 16px; fill: var(--gold); opacity: .78; }
.spoke.sin .tip { fill: #B24C39; }
.spoke.vir .tip { fill: #D8B977; }
.tip { fill: var(--gold); }
.core { fill: var(--gold); opacity: .8; }

/* 幕签 */
.actCard {
  position: fixed; inset: 0; z-index: 30; pointer-events: none;
  display: grid; place-content: center; justify-items: center; gap: 10px;
  background: rgba(7,7,10,.94);
  animation: actOut 1.55s var(--ease) forwards;
}
.actCard span { font-family: var(--latin); font-size: 26px; letter-spacing: .4em; color: var(--gold); }
.actCard em { font-family: var(--serif); font-style: normal; font-size: 15px; letter-spacing: .42em; color: var(--ink2); }
@keyframes actOut {
  0% { opacity: 0; }
  18% { opacity: 1; }
  72% { opacity: 1; }
  100% { opacity: 0; }
}

/* 形态 */
.formLead { font-family: var(--serif); font-size: clamp(17px, 2.4vw, 21px); line-height: 1.9; color: var(--ink2); margin-bottom: 30px; }
.formLead b { color: var(--ink); font-weight: 400; border-bottom: 1px solid var(--goldDim); }
.facets li { padding: 22px 0; border-top: 1px solid var(--line2); }
.fTop { display: flex; align-items: baseline; gap: 12px; }
.fName { font-family: var(--serif); font-size: 17px; letter-spacing: .08em; }
.fLatin { font-family: var(--latin); font-size: 9.5px; letter-spacing: .2em; color: var(--ink3); flex: 1; text-transform: uppercase; }
.fVal { font-size: 12px; letter-spacing: .18em; color: var(--gold); }
.facets li:not(.top) .fVal { color: var(--ink2); }
.fMeter { display: flex; gap: 5px; margin: 14px 0 14px; }
.fMeter i { display: block; flex: 1; height: 2px; background: rgba(232,227,218,.09); }
.fMeter i.on { background: var(--gold); }
.facets li:not(.top) .fMeter i.on { background: rgba(232,227,218,.45); }
.fDef { font-size: 14px; line-height: 1.9; color: var(--ink2); }
.fInsight { font-size: 14px; line-height: 1.95; color: var(--ink); margin-top: 10px; padding-left: 14px; border-left: 1px solid var(--goldDim); }

/* 形态强调色：并列第一的每一个面都上色，随本轴是罪还是德 */
.form.kind-vice .facets li.top .fVal { color: var(--blood); }
.form.kind-vice .facets li.top .fMeter i.on { background: var(--blood); }
.form.kind-vice .facets li.top .fInsight { border-left-color: rgba(192,90,69,.55); }
.form.kind-virtue .facets li.top .fVal { color: var(--gold); }
.form.kind-virtue .facets li.top .fMeter i.on { background: var(--gold); }
.form.kind-virtue .facets li.top .fInsight { border-left-color: var(--goldDim); }

/* ───── 逐面详解（深度模式） ───── */
.detailCard { --accent: var(--gold); }
.detIndex { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 22px 0 10px; padding-bottom: 18px; border-bottom: 1px solid var(--line2); }
.detIndex a {
  font-size: 12px; letter-spacing: .1em; color: var(--ink2);
  text-decoration: none; padding: 3px 0; border-bottom: 1px solid transparent;
}
.detIndex a:hover, .detIndex a:focus-visible { color: var(--ink); border-bottom-color: var(--goldDim); }
.detIndex a i { font-style: normal; color: var(--ink3); margin-left: 6px; font-family: var(--num); }
.detBlock { padding: 38px 0 30px; border-top: 1px solid var(--line2); }
.detBlock:first-of-type { border-top: 0; }
.detBlock.kind-vice { --accent: var(--blood); }
.detBlock.kind-virtue { --accent: var(--gold); }
.detHead { display: flex; align-items: baseline; gap: 14px; }
.detRank { font-family: var(--num); font-size: 12px; letter-spacing: .18em; color: var(--accent); }
.detHead h3 { font-family: var(--serif); font-weight: 400; font-size: clamp(20px, 2.6vw, 26px); letter-spacing: .06em; margin: 0; }
.detHead h3 em { font-family: var(--latin); font-style: normal; font-size: .5em; letter-spacing: .28em; color: var(--ink3); margin-left: 8px; }
.detScore { margin-left: auto; display: flex; align-items: baseline; gap: 8px; color: var(--accent); }
.detScore b { font-family: var(--num); font-weight: 300; font-size: 26px; }
.detScore i { font-style: normal; font-size: 11px; letter-spacing: .24em; color: var(--ink2); }
.detBar { height: 2px; background: rgba(232,227,218,.09); margin: 14px 0 18px; }
.detBar i { display: block; height: 2px; background: var(--accent); }
.detEssence { font-family: var(--serif); font-size: clamp(16px, 2.2vw, 19px); color: var(--ink2); line-height: 1.9; }
.detLong { margin-top: 16px; }
.detLong p { font-size: 14.5px; line-height: 2.05; color: var(--ink2); margin-bottom: 12px; }
.detFacets { margin-top: 24px; display: grid; gap: 0; }
.detFacet { padding: 20px 0; border-top: 1px solid var(--line2); }
.dfTop { display: flex; align-items: baseline; gap: 12px; }
.dfName { font-family: var(--serif); font-size: 16px; letter-spacing: .08em; }
.dfTop em { font-family: var(--latin); font-style: normal; font-size: 9.5px; letter-spacing: .2em; color: var(--ink3); text-transform: uppercase; flex: 1; }
.dfLevel { font-size: 11.5px; letter-spacing: .18em; color: var(--accent); }
.dfDims { display: flex; gap: 26px; margin: 12px 0 14px; flex-wrap: wrap; }
.dfDim { display: flex; align-items: center; gap: 8px; }
.dfDim b { font-weight: 400; font-size: 11px; letter-spacing: .12em; color: var(--ink3); }
.dfBars { display: flex; gap: 3px; }
.dfBars i { display: block; width: 18px; height: 2px; background: rgba(232,227,218,.16); }
.dfBars i.on { background: var(--accent); }
.dfDef { font-size: 14px; line-height: 1.95; color: var(--ink2); }
.dfSignals { margin: 10px 0 12px; padding: 0; list-style: none; }
.dfSignals li { position: relative; padding-left: 16px; font-size: 13.5px; line-height: 1.95; color: var(--ink2); }
.dfSignals li::before { content: '·'; position: absolute; left: 4px; color: var(--accent); }
.dfCost, .dfPractice { font-size: 13px; line-height: 1.9; color: var(--ink3); margin-top: 6px; }
.dfCost b, .dfPractice b { font-weight: 400; color: var(--accent); letter-spacing: .12em; margin-right: 8px; }
.dfTrio { font-size: 13px; line-height: 1.9; color: var(--ink2); margin: 2px 0 10px; padding-left: 12px; border-left: 1px solid var(--accent); }
.detTag { font-size: 10.5px; letter-spacing: .22em; color: var(--accent); border: 1px solid currentColor; padding: 2px 8px; }

/* 最贵的三个面 */
.costList { margin-top: 8px; }
.costCard { --accent: var(--blood); }
.costRow { display: grid; grid-template-columns: 40px minmax(120px, 1fr) auto; gap: 8px 18px; align-items: baseline; padding: 18px 0; border-top: 1px solid var(--line2); }
.costRow:first-child { border-top: 0; }
.costRank { font-family: var(--num); font-size: 12px; letter-spacing: .16em; color: var(--blood); }
.costName { font-family: var(--serif); font-size: 17px; letter-spacing: .06em; }
.costName i { font-style: normal; font-family: var(--latin); font-size: 9.5px; letter-spacing: .2em; color: var(--ink3); margin-left: 10px; text-transform: uppercase; }
.costBars { display: flex; gap: 16px; justify-self: end; }
.costWhy { grid-column: 2 / -1; font-size: 13.5px; line-height: 1.95; color: var(--ink2); }
.costFree { margin-top: 22px; font-size: 13px; line-height: 1.9; color: var(--ink3); }
.costFree b { font-weight: 400; color: var(--gold); letter-spacing: .12em; margin-right: 10px; }
@media (max-width: 620px) {
  .costRow { grid-template-columns: 30px 1fr; }
  .costBars { grid-column: 2; justify-self: start; }
}

/* 总评 */
.crossCard p { font-size: 15px; line-height: 2.1; color: var(--ink2); margin-bottom: 14px; }
.crossCard p:last-child { margin-bottom: 0; color: var(--ink); }

/* 情境对照 */
.picks { list-style: none; padding: 0; margin-top: 10px; }
.pick { padding: 20px 0; border-top: 1px solid var(--line2); }
.pick:first-child { border-top: 0; }
.pickQ { font-size: 13.5px; line-height: 1.95; color: var(--ink3); }
.pickQ span { font-family: var(--num); margin-right: 10px; color: var(--ink3); }
.pickA { font-family: var(--serif); font-size: 15.5px; line-height: 1.9; color: var(--ink); margin-top: 10px; }
.pickTag { font-size: 11.5px; letter-spacing: .16em; color: var(--gold); margin-top: 8px; }

/* 七对刻度 */
.pairTable { width: 100%; border-collapse: collapse; table-layout: fixed; }
.pairTable col.cIdx { width: 34px; }
.pairTable col.cSide { width: 17%; }
.pairTable col.cVal { width: 64px; }
.pairTable col.cBar { width: auto; }

.pairRow { border-bottom: 1px solid var(--line2); }
.pairRow:last-child { border-bottom: 0; }
.pairRow td { padding: 17px 0; vertical-align: middle; }

.pIdx { font-family: var(--num); font-size: 13px; color: var(--ink3); }
.pSide { font-family: var(--serif); }
.pSide .pName { display: block; font-size: 15px; color: var(--ink2); letter-spacing: .06em; }
.pSide em {
  display: block; font-family: var(--latin); font-style: normal; font-size: 8.5px;
  letter-spacing: .18em; color: var(--ink3); margin-top: 5px;
}
.pLeft { text-align: left; padding-right: 16px !important; }
.pRight { text-align: right; padding-left: 16px !important; }
.pairRow.isTop .pName { color: var(--ink); }
.pairRow.isTop .pIdx { color: var(--ink2); }
.pairRow.sin-left.isTop .pIdx { color: var(--blood); }
.pairRow.virtue-left.isTop .pIdx { color: var(--gold); }

.pVal { white-space: nowrap; }
.pValL { text-align: right; padding-right: 12px !important; }
.pValR { text-align: left; padding-left: 12px !important; }
.pVal b {
  display: block; font-family: var(--num); font-weight: 300; font-size: 21px;
  line-height: 1.15; color: var(--ink);
}
.pVal i {
  display: block; font-style: normal; font-size: 9.5px; letter-spacing: .2em;
  color: var(--ink3); margin-top: 3px;
}

.pBarCell { padding-left: 4px !important; padding-right: 4px !important; }
.pBar { position: relative; display: block; height: 3px; background: rgba(198,166,100,.20); }
.pBar i { position: absolute; left: 0; top: 0; height: 3px; background: linear-gradient(90deg, #D8B977, var(--gold)); }
.pairRow.sin-left .pBar { background: rgba(198,166,100,.20); }
.pairRow.sin-left .pBar i { background: linear-gradient(90deg, var(--blood), var(--bloodDeep)); }
.pairRow.virtue-left .pBar { background: rgba(176,80,63,.24); }
.pairRow.virtue-left .pBar i { background: linear-gradient(90deg, #D8B977, var(--gold)); }
.pBar::before {
  content: ""; position: absolute; left: 50%; top: -4px; bottom: -4px; width: 1px;
  background: rgba(232,227,218,.13); z-index: 2;
}
.pBar::after {
  content: ""; position: absolute; left: 0; right: 0; top: -4px; bottom: -4px;
  border-top: 1px solid rgba(232,227,218,.07); border-bottom: 1px solid rgba(232,227,218,.07);
}
.pairRow.sin-left.isTop .pValL b { color: var(--blood); }
.pairRow.virtue-left.isTop .pValL b { color: var(--gold); }

/* 叙事 */
.narrative p { font-size: 15.5px; line-height: 2.15; color: var(--ink2); margin-bottom: 20px; }
.narrative p.pivotP { color: var(--ink); border-left: 1px solid var(--goldDim); padding-left: 18px; }
.narrative b { font-weight: 400; color: var(--ink); }

/* 信号 */
.signals { counter-reset: sig; }
.signals li {
  counter-increment: sig; position: relative; padding: 14px 0 14px 42px;
  border-bottom: 1px solid var(--line2); font-size: 15px; line-height: 1.85; color: var(--ink2);
}
.signals li::before {
  content: counter(sig, decimal-leading-zero); position: absolute; left: 0; top: 16px;
  font-family: var(--num); font-size: 13px; color: var(--gold); opacity: .8;
}

/* 守护 */
.guardLine { font-family: var(--serif); font-size: 20px; letter-spacing: .1em; margin-bottom: 14px; }
.guardLine i { font-style: normal; font-size: 11px; letter-spacing: .24em; color: var(--ink3); margin-left: 6px; }
.guardCard > p { font-size: 15px; line-height: 2; color: var(--ink2); }
.practice { margin-top: 30px; padding-top: 24px; border-top: 1px solid var(--line2); }
.practice h3 { font-family: var(--serif); font-weight: 400; font-size: 15px; letter-spacing: .2em; color: var(--gold); margin-bottom: 16px; }
.practice ol { counter-reset: pr; }
.practice li { counter-increment: pr; position: relative; padding: 12px 0 12px 38px; font-size: 14.5px; line-height: 1.9; color: var(--ink2); }
.practice li::before { content: counter(pr); position: absolute; left: 4px; top: 12px; font-family: var(--num); font-size: 14px; color: var(--ink3); }

.shareLead { font-size: 14px; color: var(--ink2); line-height: 1.9; }
.nameRow { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; margin: 26px 0; }
.nameRow label { font-size: 12px; letter-spacing: .16em; color: var(--ink3); }
.nameRow input {
  background: transparent; border: 0; border-bottom: 1px solid var(--line);
  color: var(--ink); font-family: var(--serif); font-size: 16px; padding: 8px 4px; width: 180px;
  outline: none; letter-spacing: .1em;
}
.nameRow input:focus { border-color: var(--gold); }
.shareBtns { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 24px; }
.urlLine input {
  width: 100%; background: rgba(232,227,218,.03); border: 1px solid var(--line2);
  color: var(--ink3); font-family: var(--sans); font-size: 11.5px; letter-spacing: .02em;
  padding: 12px 14px; outline: none;
}
.urlLine input:focus { border-color: var(--goldDim); color: var(--ink2); }
.resFoot { padding-top: 40px; border-top: 1px solid var(--line2); display: flex; flex-direction: column; gap: 22px; }

.cardHost { padding-top: 30px; }
.cardHost canvas { width: 100%; height: auto; display: block; border: 1px solid var(--line); }

#toast {
  position: fixed; left: 50%; bottom: 34px; transform: translate(-50%, 14px);
  background: rgba(13,13,16,.96); border: 1px solid var(--goldDim); color: var(--ink);
  font-size: 13px; letter-spacing: .1em; padding: 12px 22px; opacity: 0; pointer-events: none;
  transition: opacity .3s var(--ease), transform .3s var(--ease); z-index: 50;
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ───── 黑胶角标 ───── */
.vinyl {
  position: fixed;
  left: max(18px, env(safe-area-inset-left));
  bottom: max(18px, env(safe-area-inset-bottom));
  width: 46px; height: 46px; padding: 0; border: 0; background: none;
  border-radius: 50%; cursor: pointer; z-index: 45;
  transition: transform .35s var(--ease);
}
.vinyl:hover { transform: translateY(-2px); }
.vinylDisc {
  position: absolute; inset: 0; border-radius: 50%; display: grid; place-items: center;
  background:
    radial-gradient(circle at 50% 50%, rgba(198,166,100,.20) 0 10px, transparent 10px 13px),
    repeating-radial-gradient(circle at 50% 50%, #15151a 0 .9px, #0a0a0c .9px 2.2px);
  box-shadow: 0 0 0 1px rgba(232,227,218,.16), inset 0 0 16px rgba(0,0,0,.85), 0 6px 18px rgba(0,0,0,.55);
  transition: opacity .4s var(--ease);
}
.vinylDisc::after {
  content: ""; position: absolute; inset: 0; border-radius: 50%;
  background: conic-gradient(from 0deg,
    transparent 0 6%, rgba(255,255,255,.07) 17%, transparent 33%,
    rgba(255,255,255,.045) 46%, transparent 62%,
    rgba(255,255,255,.05) 76%, transparent 91%);

  position: relative; z-index: 2; width: 18px; height: 18px; border-radius: 50%;

  box-shadow: 0 0 0 1px rgba(0,0,0,.45);
  transition: background .4s var(--ease);
}
.vinylArm {
  position: absolute; top: -2px; right: -2px; width: 21px; height: 1px; border-radius: 1px;

  transition: opacity .45s var(--ease), transform .55s var(--ease);
}
.vinylArm::after {
  content: ""; position: absolute; right: -2px; top: -2px; width: 5px; height: 5px;
  border-radius: 50%; background: var(--gold); box-shadow: 0 0 0 1px rgba(7,7,10,.8);
}
.vinyl.is-on .vinylArm { opacity: .95; transform: rotate(-24deg); }
.vinyl.is-off .vinylDisc { opacity: .7; }
.vinyl.is-off .vinylLabel { background: #8A7C58; }
.vinyl:focus-visible { outline: 2px solid var(--gold); outline-offset: 5px; }

}
@keyframes vspin { to { transform: rotate(360deg); } }

.vTrack { margin-top: 14px; font-size: 11.5px; letter-spacing: .2em; color: var(--gold); opacity: .85; }

/* ───── 动画 ───── */
@media (prefers-reduced-motion: no-preference) {
  .view > * { animation: rise .62s var(--ease) both; }
  .view > *:nth-child(1) { animation-delay: .02s; }
  .view > *:nth-child(2) { animation-delay: .06s; }
  .view > *:nth-child(3) { animation-delay: .1s; }
  .view > *:nth-child(4) { animation-delay: .14s; }
  .view > *:nth-child(5) { animation-delay: .18s; }

  .opt:nth-of-type(2) { animation-delay: .12s; }
  .opt:nth-of-type(3) { animation-delay: .16s; }
  .opt:nth-of-type(4) { animation-delay: .2s; }
  .opt:nth-of-type(5) { animation-delay: .24s; }
}
@keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

/* ───── 响应式 ───── */
@media (max-width: 760px) {

  .pVal b { font-size: 17px; }
  .pVal i { font-size: 8px; letter-spacing: .1em; }
  .pLeft { padding-right: 8px !important; }
  .pRight { padding-left: 8px !important; }
  .pValL { padding-right: 7px !important; }
  .pValR { padding-left: 7px !important; }
  .beamNums { gap: 40px; }
  .axisLabel { font-size: 13px; }
  .axisNum { font-size: 11px; }
  .facets li { padding: 18px 0; }
  .vScore b { font-size: 44px; }
  .nameRow input { width: 140px; }
}
@media (max-width: 380px) {
  .display { font-size: 40px; }
  .vName { font-size: 64px; }
  .optBody { font-size: 14.5px; }
  .chart { max-width: 100%; }
}

/* ───── 打印 ───── */
@media print {
  body { background: #fff; color: #111; }
  body::before, .grain, .bar, .shareCard, .resFoot .homeActions, #toast, .skip, .vinyl, .fbWrap { display: none !important; }
  .view { max-width: none; padding: 0; min-height: 0; }
  .card { border-color: #ddd; page-break-inside: avoid; padding: 18px 0; }
  .vName, .sec, .guardLine { color: #111; }
  .vLatin, .kicker, .sec span { color: #7a6a3a; }
  .vEssence, .narrative p, .fDef, .signals li, .guardCard > p { color: #333; }

  .detTag { color: #7a6a3a; }
}

    { t: 'Tracy & Robins (2007) 真实骄傲与自大骄傲量表；Orth & Robins (2014) 自恋与自尊之别', u: 'https://doi.org/10.1037/0022-3514.92.3.506' },

<script>
/* 七重 SEVENFOLD — 计分（浏览器与 Node 共用，唯一实现）
   两种模式：
     simple  每面 1 题（频率）+ 7 道情境 = 56
     deep    每面 3 题（频率/强度/代价）+ 14 道情境 = 161 */
(function (SF) {
  'use strict';

  var BANDS = [
    { max: 30, zh: '微弱' },
    { max: 45, zh: '轻微' },
    { max: 60, zh: '中等' },
    { max: 75, zh: '明显' },
    { max: 101, zh: '强烈' }
  ];
  var LEVELS = ['无', '弱', '中', '强', '极强'];

  function band(score) {
    for (var i = 0; i < BANDS.length; i++) if (score < BANDS[i].max) return BANDS[i].zh;
    return '强烈';
  }

  function level(value) {
    if (value < 0.5) return 0;
    if (value < 1.5) return 1;
    if (value < 2.5) return 2;
    if (value < 3.5) return 3;
    return 4;
  }

  function facetsOf(axisId) {
    return SF.FACETS.filter(function (f) { return f.axis === axisId; });
  }

  function extraOf(f) {
    return (SF.FACET_EXTRA && SF.FACET_EXTRA[f.id]) || { strength: '', strengthRev: false, costQ: '', costRev: false };
  }

  function axesSorted() {
    return SF.AXES.slice().sort(function (a, b) {
      if (a.kind !== b.kind) return a.kind === 'vice' ? -1 : 1;
      return a.order - b.order;
    });
  }

  /* 一个面的题目清单（按模式） */
  function itemsOfFacet(f, mode) {
    var ex = extraOf(f);
    var list = [{ key: f.id, dim: 'freq', rev: !!f.reverse, text: f.prompt }];
    if (mode === 'deep') {
      list.push({ key: f.id + '~s', dim: 'str', rev: !!ex.strengthRev, text: ex.strength });
      list.push({ key: f.id + '~c', dim: 'cost', rev: !!ex.costRev, text: ex.costQ });
    }
    return list;
  }

  function scenariosOf(mode) {
    return SF.SCENARIOS.filter(function (s) {
      if (mode === 'deep') return true;
      return typeof s.slot === 'number';
    });
  }

  /* ── 题序 ── */
  var DEEP_SLOTS = [12, 24, 35, 47, 58, 70, 81, 93, 104, 116, 127, 139, 150, 160];

  function buildOrder(mode) {
    mode = mode || 'simple';
    if (mode === 'simple') {
      var axes0 = axesSorted();
      var seq0 = [];
      for (var r = 0; r < 4; r++) {
        for (var i0 = 0; i0 < axes0.length; i0++) {
          var list0 = facetsOf(axes0[i0].id).map(function (f, j) { return { f: f, j: j }; });
          list0.sort(function (a, b) {
            return (a.f.reverse ? 1 : 0) - (b.f.reverse ? 1 : 0) || a.j - b.j;
          });
          if (list0[r]) seq0.push({ kind: 'facet', id: list0[r].f.id, dim: 'freq', text: list0[r].f.prompt, rev: !!list0[r].f.reverse });
        }
      }
      var bySlot0 = {};
      SF.SCENARIOS.forEach(function (s) { if (typeof s.slot === 'number') bySlot0[s.slot] = s; });
      var out0 = [], k0 = 0;
      for (var slot0 = 1; slot0 <= 56; slot0++) {
        if (bySlot0[slot0]) out0.push({ kind: 'scenario', id: bySlot0[slot0].id, slot: slot0 });
        else { var it = seq0[k0++]; it.slot = slot0; out0.push(it); }
      }
      return out0;
    }

    /* deep：每个轴一列，逐题轮转（同轴不相邻），情境题插在固定格 */
    var axes = axesSorted();
    var cols = axes.map(function (ax) {
      var items = [];
      facetsOf(ax.id).forEach(function (f) {
        itemsOfFacet(f, 'deep').forEach(function (it) { items.push(it); });
      });
      return items;
    });
    var seq = [];
    var guard = 0;
    while (guard++ < 400) {
      var pushed = false;
      for (var c = 0; c < cols.length; c++) {
        if (cols[c].length) {
          var item = cols[c].shift();
          seq.push({ kind: 'facet', id: item.key, dim: item.dim, text: item.text, rev: item.rev });
          pushed = true;
        }
      }
      if (!pushed) break;
    }

    var sins = SF.SCENARIOS.filter(function (s) { return typeof s.slot === 'number'; });
    var virs = SF.SCENARIOS.filter(function (s) { return typeof s.slot !== 'number'; });
    var mixed = [];
    for (var m = 0; m < sins.length; m++) {
      mixed.push(sins[m]);
      if (virs[m]) mixed.push(virs[m]);
    }
    var bySlot = {};
    mixed.forEach(function (s, idx) { bySlot[DEEP_SLOTS[idx]] = s; });

    var out = [], k = 0;
    for (var slot = 1; slot <= 161; slot++) {
      if (bySlot[slot]) out.push({ kind: 'scenario', id: bySlot[slot].id, slot: slot });
      else { var it2 = seq[k++]; it2.slot = slot; out.push(it2); }
    }
    return out;
  }

  /* answers 键：面 id（频率）/ id~s（强度）/ id~c（代价）/ 情境 id */
  function score(answers, mode) {
    mode = mode || 'simple';
    answers = answers || {};

    var facetRes = {};
    var axisRaw = {};

    axesSorted().forEach(function (ax) {
      var fs = facetsOf(ax.id);
      var vals = [];
      fs.forEach(function (f) {
        var dims = {};
        itemsOfFacet(f, mode).forEach(function (it) {
          var v = answers[it.key];
          if (typeof v !== 'number') v = 0;
          var s = it.rev ? (4 - v) : v;
          dims[it.dim] = s;
        });
        var keys = Object.keys(dims);
        var avg = keys.length ? keys.reduce(function (a, b) { return a + dims[b]; }, 0) / keys.length : 0;
        vals.push(avg);
        facetRes[f.id] = {
          id: f.id, axis: ax.id, value: avg,
          score: Math.round(avg / 4 * 100),
          freq: typeof dims.freq === 'number' ? dims.freq : null,
          str: typeof dims.str === 'number' ? dims.str : null,
          cost: typeof dims.cost === 'number' ? dims.cost : null
        };
      });
      var mean = vals.length ? vals.reduce(function (a, b) { return a + b; }, 0) / vals.length : 0;
      axisRaw[ax.id] = Math.round(mean / 4 * 100);
    });

    var axes = {};
    SF.AXES.forEach(function (ax) {
      axes[ax.id] = {
        id: ax.id, kind: ax.kind, zh: ax.zh, latin: ax.latin, sub: ax.sub, pair: ax.pair,
        score: axisRaw[ax.id], band: band(axisRaw[ax.id])
      };
    });

    var ranking = Object.keys(axes).map(function (id) { return axes[id]; })
      .sort(function (a, b) { return b.score - a.score || a.id.localeCompare(b.id); });
    ranking.forEach(function (r, i) { r.rank = i + 1; });

    var vices = ranking.filter(function (r) { return r.kind === 'vice'; });
    var virtues = ranking.filter(function (r) { return r.kind === 'virtue'; });

    function mean(arr) {
      return arr.reduce(function (a, b) { return a + b.score; }, 0) / arr.length;
    }
    var viceMean = Math.round(mean(vices) * 10) / 10;
    var virtueMean = Math.round(mean(virtues) * 10) / 10;
    var delta = Math.round((viceMean - virtueMean) * 10) / 10;

    var topVice = vices[0];
    var topVirtue = virtues[0];
    var verdictAxis = topVice.score >= topVirtue.score ? topVice : topVirtue;
    var secondAxis = verdictAxis === topVice ? topVirtue : topVice;
    var tie = Math.abs(topVice.score - topVirtue.score) < 6;

    /* 形态：跟着判词走——判词是德就展开这个德的面，是罪就展开这个罪的面 */
    var formAxis = verdictAxis;
    var formFacets = facetsOf(formAxis.id).map(function (f) {
      var r = facetRes[f.id];
      return {
        id: f.id, name: f.name, latin: f.latin, value: r.value, score: r.score,
        def: f.def, insight: f.insight, signals: f.signals, cost: f.cost, practice: f.practice
      };
    }).sort(function (a, b) { return b.value - a.value || a.id.localeCompare(b.id); });
    var topFacetValue = formFacets[0].value;
    var topFacets = formFacets.filter(function (f) { return f.value === topFacetValue; });

    var orderOf = {};
    SF.AXES.forEach(function (a) { orderOf[a.id] = a.order; });
    var pairs = vices.map(function (vAx) {
      var mate = axes[SF.PAIRS[vAx.id] || vAx.pair];
      var total = vAx.score + mate.score;
      var sinShare = total > 0 ? Math.round(vAx.score / total * 100) : 50;
      if (sinShare < 0) sinShare = 0;
      if (sinShare > 100) sinShare = 100;
      var virtueShare = 100 - sinShare;
      return {
        sinId: vAx.id, virtueId: mate.id,
        sin: vAx, virtue: mate,
        sinShare: sinShare, virtueShare: virtueShare,
        sinBand: band(sinShare), virtueBand: band(virtueShare),
        spread: Math.abs(sinShare - 50)
      };
    }).sort(function (a, b) {
      return b.spread - a.spread || orderOf[a.sinId] - orderOf[b.sinId];
    });

    /* 情境：作答、陷阱、对照 */
    var scenarioAnswer = {};
    var trapHits = 0;
    var scenarioPick = [];
    SF.SCENARIOS.forEach(function (s) {
      var idx = answers[s.id];
      if (typeof idx === 'number') {
        scenarioAnswer[s.id] = idx;
        var opt = s.options[idx];
        if (opt) {
          if (opt.trap) trapHits++;
          scenarioPick.push({
            id: s.id, axis: s.axis || null, text: s.text,
            option: opt.t, facetId: opt.facet || null,
            facetName: opt.facet ? (SF.FACETS.filter(function (f) { return f.id === opt.facet; })[0] || {}).name || '' : '',
            sign: s.axis ? (opt.eff[s.axis] || 0) : 0
          });
        }
      }
    });

    var ownScenario = SF.SCENARIOS.filter(function (s) {
      return s.options.some(function (o) { return o.eff[formAxis.id] !== undefined; });
    })[0];
    var blind = 'scenarioNeutral';
    var blindChoice = null;
    if (ownScenario) {
      var ai = scenarioAnswer[ownScenario.id];
      if (typeof ai === 'number' && ownScenario.options[ai]) {
        var effSign = ownScenario.options[ai].eff[formAxis.id] || 0;
        blindChoice = { scenarioId: ownScenario.id, optionIndex: ai, text: ownScenario.options[ai].t, sign: effSign };
        if (effSign > 0 && formAxis.score < 50) blind = 'blindUp';
        else if (effSign < 0 && formAxis.score >= 60) blind = 'blindDown';
      }
    }

    /* 逐面详解：14 轴全量，按分数排序 */
    var detail = ranking.map(function (ax) {
      var fs = facetsOf(ax.id).map(function (f) {
        var r = facetRes[f.id];
        return {
          id: f.id, name: f.name, latin: f.latin,
          def: f.def, signals: f.signals, cost: f.cost, practice: f.practice,
          value: r.value, score: r.score,
          freq: r.freq, str: r.str, costDim: r.cost,
          level: level(r.value), levelText: LEVELS[level(r.value)]
        };
      }).sort(function (a, b) { return b.value - a.value || a.id.localeCompare(b.id); });
      var axisMeta = SF.AXES.filter(function (a) { return a.id === ax.id; })[0];
      return {
        axis: ax, kind: ax.kind, zh: ax.zh, latin: ax.latin,
        essence: axisMeta.essence, long: axisMeta.long,
        facets: fs
      };
    });

    /* 三维组合键（只有深度模式的三条都有值时才成立） */
    detail.forEach(function (d) {
      d.facets.forEach(function (f) {
        if (f.freq == null || f.str == null || f.costDim == null) { f.trio = null; return; }
        f.trio = (f.freq >= 2.5 ? 'H' : 'L') + (f.str >= 2.5 ? 'H' : 'L') + (f.costDim >= 2.5 ? 'H' : 'L');
      });
    });

    /* 最贵的面 / 还在白拿的面 */
    var costed = [];
    detail.forEach(function (d) {
      d.facets.forEach(function (f) {
        if (f.costDim == null) return;
        costed.push({
          axisId: d.axis.id, axisZh: d.zh, kind: d.kind,
          id: f.id, name: f.name, latin: f.latin,
          freq: f.freq, str: f.str, cost: f.costDim, costText: f.cost,
          weight: f.costDim * 0.5 + (f.str || 0) * 0.3 + (f.freq || 0) * 0.2
        });
      });
    });
    var costly = costed.slice().sort(function (a, b) { return b.weight - a.weight || a.id.localeCompare(b.id); }).slice(0, 3);
    var freeOnes = costed.filter(function (x) { return x.freq >= 2.5 && x.cost < 1.5; })
      .sort(function (a, b) { return b.freq - a.freq || a.id.localeCompare(b.id); }).slice(0, 3);

    /* 落差：还在门口 vs 已经在扣钱 */
    var door = null, bite = null;
    costed.forEach(function (x) {
      if (x.str == null) return;
      var d1 = x.str - x.cost;
      if (d1 > 0 && (!door || d1 > door.gap)) door = { gap: d1, item: x };
      var d2 = x.cost - x.str;
      if (d2 > 0 && (!bite || d2 > bite.gap)) bite = { gap: d2, item: x };
    });
    var gap = {
      door: door && door.gap >= 0.8 ? door.item : null,
      bite: bite && bite.gap >= 0.8 ? bite.item : null
    };

    var scores = SF.AXES.map(function (a) { return axisRaw[a.id]; });
    var spread = Math.max.apply(null, scores) - Math.min.apply(null, scores);
    var flat = spread < 12;
    var low = Math.max.apply(null, scores) < 25;
    var high = Math.min.apply(null, scores) > 75;

    return {
      mode: mode,
      facets: facetRes,
      axes: axes,
      ranking: ranking,
      viceMean: viceMean,
      virtueMean: virtueMean,
      delta: delta,
      topVice: topVice,
      topVirtue: topVirtue,
      verdictAxis: verdictAxis,
      secondAxis: secondAxis,
      tie: tie,
      spread: spread,
      pairs: pairs,
      detail: detail,
      costRank: { costly: costly, free: freeOnes },
      gap: gap,
      top3: ranking.slice(0, 3),
      form: { axis: formAxis, facets: formFacets, top: topFacets, composite: topFacets.length > 1 },
      scenario: {
        answers: scenarioAnswer, trapHits: trapHits, blind: blind, blindChoice: blindChoice,
        ownScenario: ownScenario ? ownScenario.id : null, picks: scenarioPick
      },
      special: { flat: flat, low: low, high: high, tie: tie, ideal: trapHits >= 2 }
    };
  }

  SF.band = band;
  SF.level = level;
  SF.LEVELS = LEVELS;
  SF.facetsOf = facetsOf;
  SF.axesSorted = axesSorted;
  SF.itemsOfFacet = itemsOfFacet;
  SF.scenariosOf = scenariosOf;
  SF.buildOrder = buildOrder;
  SF.score = score;
  SF.LIMITS = { simple: 56, deep: 161 };
})(self.SF = self.SF || {});

</script>
<script>
/* 七重 SEVENFOLD — 答案编解码
   v1 简约：1 字节版本 + 49×3bit（频率）+ 7×2bit（情境） = 22 字节
   v2 深度：1 字节版本 + 49×9bit（频/强/代）+ 14×2bit（情境） = 60 字节 */
(function (SF) {
  'use strict';

  var V1 = 1, V2 = 2;

  function toB64url(bytes) {
    var s = '';
    for (var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
    return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }

  function fromB64url(str) {
    if (!/^[A-Za-z0-9_-]+$/.test(str)) throw new Error('bad-chars');
    var b = str.replace(/-/g, '+').replace(/_/g, '/');
    while (b.length % 4) b += '=';
    var bin = atob(b);
    var out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  function push(bits, v, n) {
    for (var i = n - 1; i >= 0; i--) bits.push((v >> i) & 1);
  }

  function pack(bits) {
    while (bits.length % 8) bits.push(0);
    var bytes = new Uint8Array(bits.length / 8);
    for (var i = 0; i < bits.length; i += 8) {
      var byte = 0;
      for (var j = 0; j < 8; j++) byte = (byte << 1) | bits[i + j];
      bytes[i / 8] = byte;
    }
    return toB64url(bytes);
  }

  function num(answers, key, max) {
    var v = answers[key];
    if (typeof v !== 'number' || v < 0 || v > max) return 0;
    return v;
  }

  function scenariosOf(mode) {
    return SF.SCENARIOS.filter(function (s) {
      return mode === 'deep' ? true : typeof s.slot === 'number';
    });
  }

  function encode(answers, mode) {
    mode = mode || (Object.keys(answers || {}).some(function (k) { return k.slice(-2) === '~s'; }) ? 'deep' : 'simple');
    var bits = [];
    if (mode === 'deep') {
      push(bits, V2, 8);
      SF.FACETS.forEach(function (f) {
        push(bits, num(answers, f.id, 4), 3);
        push(bits, num(answers, f.id + '~s', 4), 3);
        push(bits, num(answers, f.id + '~c', 4), 3);
      });
      scenariosOf('deep').forEach(function (s) { push(bits, num(answers, s.id, 3), 2); });
      return pack(bits);
    }
    push(bits, V1, 8);
    SF.FACETS.forEach(function (f) { push(bits, num(answers, f.id, 4), 3); });
    scenariosOf('simple').forEach(function (s) { push(bits, num(answers, s.id, 3), 2); });
    return pack(bits);
  }

  function unpack(payload) {
    var bytes = fromB64url(payload);
    var bits = [];

      if (u.length !== 22) throw new Error('bad-length');
      SF.FACETS.forEach(function (f) {

        if (v > 4) throw new Error('bad-value');

<script>
/* 七重 SEVENFOLD — 音乐引擎（<audio> 流式，整首循环）
   构建注入：
     window.__SF_TRACKS__     = { v_superbia: 'data:audio/mpeg;base64,...' }
     window.__SF_TRACK_META__ = { v_superbia: 'FrostWave - Chaikovsky' }
     window.__SF_UNIFIED__    = ''   // 为空表示首页/做题不播放
   没有音轨时（静音版）整个模块自我隐藏。 */
(function (SF) {
  'use strict';

  var TRACKS = window.__SF_TRACKS__ || {};
  var META = window.__SF_TRACK_META__ || {};
  var UNIFIED = window.__SF_UNIFIED__ || '';
  var STORE = 'sevenfold.music';
  var VOL = 0.85, VOL_UNIFIED = 0.5, FADE_IN = 1600, FADE_OUT = 900;

  var el = null, btn = null;
  var on = false, pref = null;
  var currentKey = null, currentTheme = 'unified';
  var fadeTimer = null, listeners = [];
  var gestureDone = false;

  function keys() { return Object.keys(TRACKS); }
  function hasAudio() { return keys().length > 0; }
  function hasTrackFor(id) { return !!TRACKS[id]; }
  function titleFor(id) { return META[id] || ''; }

  function resolve(theme) {
    if (theme && TRACKS[theme]) return theme;
    if (UNIFIED && TRACKS[UNIFIED]) return UNIFIED;
    return null;
  }

  function readPref() { try { return localStorage.getItem(STORE); } catch (e) { return null; } }
  function savePref(v) { try { localStorage.setItem(STORE, v); } catch (e) {} }

  function showBadge(show) {
    if (!btn) btn = document.getElementById('vinyl');
    if (!btn) return;
    btn.hidden = !show;
  }

  function syncBtn() {
    if (!btn) return;
    btn.classList.toggle('is-on', on);
    btn.classList.toggle('is-off', !on);
    btn.setAttribute('aria-pressed', on ? 'true' : 'false');
    btn.setAttribute('aria-label', on ? '音乐 开' : '音乐 关');
    var t = currentKey && META[currentKey] ? ' · ' + META[currentKey] : '';
    btn.setAttribute('title', (on ? '关闭音乐' : '开启音乐') + t);
  }

  function ensureEl() {
    if (el) return el;
    el = document.createElement('audio');
    el.loop = true;
    el.preload = 'none';
    el.setAttribute('playsinline', '');
    el.style.display = 'none';
    document.body.appendChild(el);
    el.addEventListener('error', function () {
      on = false;
      syncBtn();
    });
    return el;
  }

  function fade(to, ms) {
    var a = ensureEl();
    if (fadeTimer) { clearInterval(fadeTimer); fadeTimer = null; }
    var from = a.volume;
    var t0 = Date.now();
    fadeTimer = setInterval(function () {
      var p = Math.min(1, (Date.now() - t0) / ms);
      a.volume = Math.max(0, Math.min(1, from + (to - from) * p));
      if (p >= 1) { clearInterval(fadeTimer); fadeTimer = null; }
    }, 30);
  }

  function playKey(key) {
    var a = ensureEl();
    if (!key) return;
    var vol = key === 'unified' ? VOL_UNIFIED : VOL;
    if (currentKey === key && !a.paused) { fade(vol, 400); on = true; syncBtn(); return; }
    currentKey = key;
    a.src = TRACKS[key];
    a.volume = 0;
    var p = a.play();
    if (p && p.catch) p.catch(function () {
      /* 没有用户手势，被自动播放策略拦下：把按钮复位，等用户点 */
      on = false;
      syncBtn();

    on = true;
    syncBtn();
    notify();
  }

  function stopNow() {
    var a = ensureEl();
    fade(0, FADE_OUT);
    setTimeout(function () {
      if (on) return;
      try { a.pause(); } catch (e) {}
      currentKey = null;
    }, FADE_OUT + 80);
  }

  function notify() {
    listeners.forEach(function (fn) { try { fn(on); } catch (e) {} });
  }

  function setTheme(id) {
    currentTheme = id || 'unified';
    var key = resolve(currentTheme);
    if (!key) {
      /* 这个页面没有音乐：停播、收起角标 */
      if (on) { on = false; stopNow(); syncBtn(); notify(); }
      showBadge(false);
      return;
    }
    showBadge(true);
    if (pref === 'off') { on = false; syncBtn(); return; }
    /* 还没有用户手势：先不播，等第一次点击再淡入（浏览器自动播放策略） */
    if (!gestureDone) { syncBtn(); return; }
    playKey(key);
  }

  function firstGesture() {
    if (gestureDone) return;
    gestureDone = true;
    document.removeEventListener('pointerdown', firstGesture, true);
    document.removeEventListener('keydown', firstGesture, true);
    document.removeEventListener('touchstart', firstGesture, true);
    document.removeEventListener('click', firstGesture, true);
    if (pref === 'off') return;
    var key = resolve(currentTheme);
    if (key && !on) playKey(key);
  }

  /* 封面的「开始」按钮：在真实手势里直接起播 */
  function start() {
    gestureDone = true;
    document.removeEventListener('pointerdown', firstGesture, true);
    document.removeEventListener('keydown', firstGesture, true);
    document.removeEventListener('touchstart', firstGesture, true);
    document.removeEventListener('click', firstGesture, true);
    if (pref === 'off') { syncBtn(); return; }
    var key = resolve(currentTheme);
    if (key) playKey(key);
  }

  function toggle() {
    if (!hasAudio()) return;
    var key = resolve(currentTheme);
    if (!key) return;
    if (on) {
      pref = 'off'; savePref('off');
      on = false; stopNow(); syncBtn(); notify();
      if (SF.toast) SF.toast('音乐已关');
    } else {
      pref = 'on'; savePref('on');
      playKey(key);
      if (SF.toast) SF.toast('音乐已开');
    }
  }

  function debug() {
    var a = el;
    return {
      supported: hasAudio(),
      theme: currentTheme,
      key: currentKey,
      hasTrack: !!resolve(currentTheme),
      paused: a ? a.paused : true,
      duration: a && isFinite(a.duration) ? Math.round(a.duration * 10) / 10 : 0,
      volume: a ? Math.round(a.volume * 100) / 100 : 0,
      muted: a ? !!a.muted : false,
      on: on,
      badge: btn ? !btn.hidden : false

  }

  function boot() {
    btn = document.getElementById('vinyl');
    if (!hasAudio()) { showBadge(false); return; }
    pref = readPref();
    if (btn) {
      btn.addEventListener('click', function (e) { e.preventDefault(); toggle(); });
      btn.hidden = true;
      syncBtn();
    }
    /* 通用曲：等第一次点击/按键再起播，符合浏览器自动播放策略 */
    document.addEventListener('pointerdown', firstGesture, true);
    document.addEventListener('touchstart', firstGesture, true);
    document.addEventListener('keydown', firstGesture, true);
    document.addEventListener('click', firstGesture, true);
    document.addEventListener('visibilitychange', function () {
      if (!el) return;
      if (document.hidden) { try { el.pause(); } catch (e) {} }
      else if (on && resolve(currentTheme)) { try { el.play(); } catch (e) {} }
    });
  }

  SF.music = {
    boot: boot,
    setTheme: setTheme,
    toggle: toggle,
    start: start,
    isOn: function () { return on; },
    hasAudio: hasAudio,
    hasTrackFor: hasTrackFor,
    titleFor: titleFor,
    onChange: function (fn) { listeners.push(fn); },
    debug: debug
  };
})(self.SF = self.SF || {});

    var answered = state.answers[item.id];

    var body;
    if (item.kind === 'scenario') {
      var sc = SF.SCENARIOS.filter(function (s) { return s.id === item.id; })[0];

        + '<p class="qKicker">情境 · ' + String(idx + 1).padStart(2, '0') + '</p>'
        + '<h2 class="qText qScenario">' + esc(sc.text) + '</h2>'
        + '<fieldset class="opts optsText"><legend class="sr">选择一个反应</legend>'

        + '<fieldset class="opts optsScale"><legend class="sr">像不像你</legend>'

    app.innerHTML = ''
      + '<section class="view test">'
      + '  <header class="bar">'
      + '    <a class="barBack" href="#/home" aria-label="回到开头">←</a>'
      + '    <span class="barAct">' + act.label + '</span>'
      + '    <span class="barCount">' + String(idx + 1).padStart(2, '0') + ' <i>/ ' + TOTAL + '</i></span>'
      + '  </header>'
      + '  <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="' + TOTAL + '" aria-valuenow="' + (idx) + '"><i style="width:' + (idx / TOTAL * 100).toFixed(2) + '%"></i></div>'
      + '  <div class="qWrap">' + body + '</div>'

      + '  </footer>'
      + '</section>';

    app.setAttribute('data-view', 'test');
    var actHere = actsOf().filter(function (a) { return a.at === idx; })[0];
    if (actHere && !reduceMotion()) {
      var bits = actHere.label.split(' · ');
      var card = document.createElement('div');
      card.className = 'actCard';
      card.setAttribute('aria-hidden', 'true');
      card.innerHTML = '<span>' + esc(bits[0]) + '</span><em>' + esc(bits.slice(1).join(' · ')) + '</em>';
      app.appendChild(card);
      setTimeout(function () { card.remove(); }, 1600);
    }
    focusHead();
  }

  function choose(value) {
    var item = order()[state.index];
    if (!item) return;
    if (advanceTimer) { clearTimeout(advanceTimer); advanceTimer = null; }
    state.answers[item.id] = value;
    save();
    var labels = app.querySelectorAll('.opt');
    labels.forEach(function (l) { l.classList.remove('on'); });
    var el = app.querySelector('.opt input[value="' + value + '"]');
    if (el) {
      el.checked = true;
      el.closest('.opt').classList.add('on');
    }
    var next = state.index + 1;
    var TOTAL = total();
    advanceTimer = setTimeout(function () {
      advanceTimer = null;
      if (next >= TOTAL) {
        finish();
      } else {
        state.index = next;
        save();
        location.hash = '#/test' + (state.mode === 'deep' ? '/deep' : '');
        renderTest();
      }
    }, reduceMotion() ? 60 : 170);
  }

  function back() {
    if (state.index === 0) return;
    state.index -= 1;
    save();
    renderTest();
  }

  function finish() {
    var payload = SF.codec.encode(state.answers, state.mode);
    try { localStorage.setItem(STORE + '.last', payload); } catch (e) { /* 忽略 */ }
    location.hash = '#/r/' + payload + (state.name ? '&n=' + SF.codec.encodeName(state.name) : '');
  }

  function chartSVG(ranking) {
    var narrow = (window.innerWidth || 800) < 640;
    var cx = 360, cy = 360, r0 = narrow ? 50 : 56, r1 = narrow ? 230 : 286, span = r1 - r0;
    var labOff = narrow ? 36 : 26;
    var fsName = narrow ? 31 : 18, fsNum = narrow ? 27 : 16;
    var axes = SF.axesSorted();
    var sinIdx = axes.filter(function (a) { return a.kind === 'vice'; });
    var virIdx = axes.filter(function (a) { return a.kind === 'virtue'; });
    var start = -167.142, step = 25.714;
    var byId = {};
    ranking.forEach(function (r) { byId[r.id] = r; });

    function pt(angle, r) {
      var rad = angle * Math.PI / 180;
      return [cx + Math.cos(rad) * r, cy + Math.sin(rad) * r];
    }
    var g = '';
    /* 同心圈 */
    [0.25, 0.5, 0.75, 1].forEach(function (k) {
      g += '<circle class="ring" cx="' + cx + '" cy="' + cy + '" r="' + (r0 + span * k) + '"/>';
    });
    g += '<line class="horizon" x1="' + (cx - r1 - 20) + '" y1="' + cy + '" x2="' + (cx + r1 + 20) + '" y2="' + cy + '"/>';

    var defs = '<defs>'
      + '<radialGradient id="gSin" gradientUnits="userSpaceOnUse" cx="' + cx + '" cy="' + cy + '" r="' + r1 + '">'
      + '<stop offset="0.10" stop-color="#B24C39"/><stop offset="0.62" stop-color="#9A3E2E"/><stop offset="1" stop-color="#7E2C22"/></radialGradient>'
      + '<radialGradient id="gVir" gradientUnits="userSpaceOnUse" cx="' + cx + '" cy="' + cy + '" r="' + r1 + '">'
      + '<stop offset="0.10" stop-color="#E3C88A"/><stop offset="0.62" stop-color="#C6A664"/><stop offset="1" stop-color="#A8853F"/></radialGradient>'
      + '</defs>';

    sinIdx.forEach(function (ax, i) {
      var a = start + i * step;
      var sc = byId[ax.id].score;
      var p0 = pt(a, r0), p1 = pt(a, r0 + span * sc / 100);
      var lab = pt(a, r1 + labOff), lab2 = [lab[0], lab[1] - (narrow ? 30 : 24)];
      g += '<g class="spoke sin">'
        + '<line class="spokeBase" x1="' + p0[0].toFixed(1) + '" y1="' + p0[1].toFixed(1) + '" x2="' + pt(a, r1)[0].toFixed(1) + '" y2="' + pt(a, r1)[1].toFixed(1) + '"/>'
        + '<line class="spokeBar sin" data-x2="' + p1[0].toFixed(1) + '" data-y2="' + p1[1].toFixed(1) + '" x1="' + p0[0].toFixed(1) + '" y1="' + p0[1].toFixed(1) + '" x2="' + p0[0].toFixed(1) + '" y2="' + p0[1].toFixed(1) + '" stroke="url(#gSin)"/>'
        + '<circle class="tip" data-cx="' + p1[0].toFixed(1) + '" data-cy="' + p1[1].toFixed(1) + '" cx="' + p0[0].toFixed(1) + '" cy="' + p0[1].toFixed(1) + '" r="2.6"/>'
        + '<text class="axisLabel" style="font-size:' + fsName + 'px" x="' + lab[0].toFixed(1) + '" y="' + lab[1].toFixed(1) + '" text-anchor="middle">' + esc(ax.zh) + '</text>'
        + '<text class="axisNum" style="font-size:' + fsNum + 'px" x="' + lab2[0].toFixed(1) + '" y="' + lab2[1].toFixed(1) + '" text-anchor="middle">' + sc + '</text>'
        + '</g>';
    });

    virIdx.forEach(function (ax, i) {
      var a = -start - i * step;
      var sc = byId[ax.id].score;
      var p0 = pt(a, r0), p1 = pt(a, r0 + span * sc / 100);
      var lab = pt(a, r1 + labOff + 4), lab2 = [lab[0], lab[1] + (narrow ? 30 : 24)];
      g += '<g class="spoke vir">'
        + '<line class="spokeBase" x1="' + p0[0].toFixed(1) + '" y1="' + p0[1].toFixed(1) + '" x2="' + pt(a, r1)[0].toFixed(1) + '" y2="' + pt(a, r1)[1].toFixed(1) + '"/>'
        + '<line class="spokeBar vir" data-x2="' + p1[0].toFixed(1) + '" data-y2="' + p1[1].toFixed(1) + '" x1="' + p0[0].toFixed(1) + '" y1="' + p0[1].toFixed(1) + '" x2="' + p0[0].toFixed(1) + '" y2="' + p0[1].toFixed(1) + '" stroke="url(#gVir)"/>'
        + '<circle class="tip" data-cx="' + p1[0].toFixed(1) + '" data-cy="' + p1[1].toFixed(1) + '" cx="' + p0[0].toFixed(1) + '" cy="' + p0[1].toFixed(1) + '" r="2.6"/>'
        + '<text class="axisLabel" style="font-size:' + fsName + 'px" x="' + lab[0].toFixed(1) + '" y="' + lab[1].toFixed(1) + '" text-anchor="middle">' + esc(ax.zh) + '</text>'
        + '<text class="axisNum" style="font-size:' + fsNum + 'px" x="' + lab2[0].toFixed(1) + '" y="' + lab2[1].toFixed(1) + '" text-anchor="middle">' + sc + '</text>'
        + '</g>';
    });

    return '<svg class="chart" viewBox="0 0 720 720" role="img" aria-label="十四项刻度分布图，数据见下方列表">'
      + defs + g + '<circle class="core" cx="' + cx + '" cy="' + cy + '" r="3"/></svg>';
  }

  function animChart() {
    var bars = app.querySelectorAll('.spokeBar');
    bars.forEach(function (bar) {
      var x2 = bar.getAttribute('data-x2'), y2 = bar.getAttribute('data-y2');
      if (reduceMotion()) { bar.setAttribute('x2', x2); bar.setAttribute('y2', y2); return; }
      var x1 = +bar.getAttribute('x1'), y1 = +bar.getAttribute('y1');
      var t0 = performance.now();
      function step(t) {
        var p = Math.min(1, (t - t0) / 800);
        var e = 1 - Math.pow(1 - p, 3);
        bar.setAttribute('x2', (x1 + (+x2 - x1) * e).toFixed(1));
        bar.setAttribute('y2', (y1 + (+y2 - y1) * e).toFixed(1));
        if (p < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    });
    var tips = app.querySelectorAll('.tip');
    tips.forEach(function (c, i) {
      var cx = c.getAttribute('data-cx'), cy = c.getAttribute('data-cy');
      if (reduceMotion()) { c.setAttribute('cx', cx); c.setAttribute('cy', cy); return; }
      setTimeout(function () { c.style.transition = 'cx .8s ease, cy .8s ease'; c.setAttribute('cx', cx); c.setAttribute('cy', cy); }, 0);
    });
  }

  function animBeam(delta) {
    var angle = Math.max(-11, Math.min(11, delta / 4));
    var bl = document.getElementById('beamL');
    if (!bl) return;
    var br = document.getElementById('beamR');
    var t0 = performance.now();
    function frame(t) {
      var p = reduceMotion() ? 1 : Math.min(1, (t - t0) / 900);
      var e = 1 - Math.pow(1 - p, 3);
      var a = angle * e * Math.PI / 180;
      var cx = 300, cy = 96, half = 204;
      var dx = Math.cos(a) * half, dy = Math.sin(a) * half;
      var lx = cx - dx, ly = cy - dy, rx = cx + dx, ry = cy + dy;
      bl.setAttribute('x2', lx.toFixed(1));
      bl.setAttribute('y2', ly.toFixed(1));
      br.setAttribute('x2', rx.toFixed(1));
      br.setAttribute('y2', ry.toFixed(1));
      document.getElementById('thL').setAttribute('x1', lx.toFixed(1));
      document.getElementById('thL').setAttribute('y1', ly.toFixed(1));
      document.getElementById('thL').setAttribute('x2', lx.toFixed(1));
      document.getElementById('thL').setAttribute('y2', (ly + 44).toFixed(1));
      document.getElementById('thR').setAttribute('x1', rx.toFixed(1));
      document.getElementById('thR').setAttribute('y1', ry.toFixed(1));
      document.getElementById('thR').setAttribute('x2', rx.toFixed(1));
      document.getElementById('thR').setAttribute('y2', (ry + 44).toFixed(1));
      document.getElementById('panL').setAttribute('transform', 'translate(' + (lx - 96).toFixed(1) + ',' + (ly - 96).toFixed(1) + ')');
      document.getElementById('panR').setAttribute('transform', 'translate(' + (rx - 504).toFixed(1) + ',' + (ry - 96).toFixed(1) + ')');
      if (p < 1) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }
