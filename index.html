    return '<section class="card detailCard">'
      + '<h2 class="sec">逐面详解 <span>THE WHOLE SHAPE</span></h2>'
      + '<p class="note">十四个轴、四十九个面。每个面分别记了频率、强度与代价三条，三条各自独立，不互相抵消。</p>'
      + '<nav class="detIndex" aria-label="轴索引">' + index + '</nav>'
      + blocks
      + '</section>';
  }

  function picksSection(R) {
    var picks = R.scenario.picks;
    if (!picks.length) return '';
    var rows = picks.map(function (p, i) {
      return '<li class="pick">'
        + '<p class="pickQ"><span>' + String(i + 1).padStart(2, '0') + '</span>' + esc(p.text) + '</p>'
        + '<p class="pickA">你选的是：' + esc(p.option) + '</p>'
        + '<p class="pickTag">' + (p.facetName ? '落在「' + esc(p.facetName) + '」' : '回避与对治倾向') + '</p>'
        + '</li>';
    }).join('');
    return '<section class="card picksCard">'
      + '<h2 class="sec">情境对照 <span>IN THE MOMENT</span></h2>'
      + '<p class="note">情境题只有一个正确答案：你当时的那个反应。下面是它落在哪一面。</p>'
      + '<ol class="picks">' + rows + '</ol>'
      + '</section>';
  }

  function costSection(R) {
    var c = R.costRank;
    if (!c || !c.costly.length) return '';
    var strip = function (s) { return String(s || '').replace(/[。！？；]+$/, ''); };
    var rows = c.costly.map(function (x, i) {
      return '<li class="costRow">'
        + '<span class="costRank">' + String(i + 1).padStart(2, '0') + '</span>'
        + '<span class="costName">' + esc(x.name) + '<i>' + esc(x.axisZh) + '</i></span>'
        + '<span class="costBars">' + dimBar('频', x.freq) + dimBar('强', x.str) + dimBar('代', x.cost) + '</span>'
        + '<span class="costWhy">' + esc(strip(x.costText)) + '</span>'
        + '</li>';
    }).join('');
    var freeLine = c.free.length
      ? '<p class="costFree"><b>还在白拿</b>' + c.free.map(function (x) { return esc(x.name) + '（' + esc(x.axisZh) + '）'; }).join('、') + '</p>'
      : '<p class="costFree"><b>还在白拿</b>没有明显白拿的部分：你现在花掉的东西，基本都对应着真实的代价。</p>';
    return '<section class="card costCard">'
      + '<h2 class="sec">最贵的三个面 <span>WHERE IT COSTS</span></h2>'
      + '<p class="note">按代价为主、强度和频率为辅排出来的三处。左右两边一起看：上面是它在收什么，下面是它还没收到什么。</p>'
      + '<ol class="costList">' + rows + '</ol>'
      + freeLine
      + '</section>';
  }

  function crossSection(R) {
    var t = R.top3;
    var a = t[0], b = t[1], c = t[2];
    var axAll = {};
    SF.AXES.forEach(function (x) { axAll[x.id] = x; });
    var strip = function (s) { return String(s || '').replace(/[。！？；，]+$/, ''); };
    var pairOfA = SF.PAIRS[a.id] || axAll[a.id].pair;
    var lines = [];
    lines.push('你的前三位是「' + a.zh + '」' + a.score + '、「' + b.zh + '」' + b.score + '、「' + c.zh + '」' + c.score + '。');
    if (pairOfA === b.id) {
      lines.push('前两位正好是同一对的两端。这不是矛盾：同一条轴的两侧你都站得很高，说明这块地方被你反复经过——既怕它落在别人那边，又常常用另一边的方式去补。');
    } else {
      lines.push('「' + a.zh + '」和「' + b.zh + '」不在同一条轴上，它们各自独立地高。放在一起看，通常是前者先动、后者收尾：' + strip(axAll[a.id].essence) + '；而' + strip(axAll[b.id].essence) + '。');
    }
    lines.push(c.score >= 60
      ? '第三位的「' + c.zh + '」也站在前面（' + c.score + '）。三条同时在高的地方，通常是你最用力维持的样子，也是最容易被一句话戳破的地方。'
      : '第三位的「' + c.zh + '」是这块地方的退路：当上面两条撑不住时，你会退到这里。它自己不算强，但它决定了你崩下来时的样子。');
    var costFacet = R.detail[0].facets[0];
    lines.push('最容易失手的场景，是' + strip(costFacet.cost) + '。这句话描述的不是性格，是已经发生过的后果。');

    if (R.gap.door && R.gap.bite) {
      var d1 = R.gap.door, d2 = R.gap.bite;
      lines.push('再往下看一层：「' + d1.name + '」上你难受得多、付出得少（强度 ' + d1.str.toFixed(1) + '，代价 ' + d1.cost.toFixed(1) + '），它还在门口；而「'
        + d2.name + '」上你几乎不觉得疼，代价却已经在扣（强度 ' + d2.str.toFixed(1) + '，代价 ' + d2.cost.toFixed(1) + '）。前者会吵，后者才要紧。');
    } else if (R.gap.bite) {
      var b1 = R.gap.bite;
      lines.push('值得留意的是「' + b1.name + '」：它不太让你难受（强度 ' + b1.str.toFixed(1) + '），代价却已经落在你身上（' + b1.cost.toFixed(1) + '）。不疼的地方最容易拖。');
    } else if (R.gap.door) {
      var g1 = R.gap.door;
      lines.push('「' + g1.name + '」的分量主要在感受上（强度 ' + g1.str.toFixed(1) + '），代价还停在 ' + g1.cost.toFixed(1) + '——它吵，但还没真正咬到你。');
    }

    return '<section class="card crossCard">'
      + '<h2 class="sec">总评 <span>THE CROSS</span></h2>'
      + lines.map(function (p) { return '<p>' + esc(p) + '</p>'; }).join('')
      + '</section>';
  }

  function renderResult(answers, name, isDemo, mode) {
    mode = mode || 'simple';
    var R = SF.score(answers, mode);
    currentName = name || '';
    var trackTitle = (SF.music && SF.music.hasTrackFor(R.verdictAxis.id)) ? SF.music.titleFor(R.verdictAxis.id) : '';
    if (SF.music) SF.music.setTheme(R.verdictAxis.id);
    var v = R.verdictAxis;
    var ax = {};
    SF.AXES.forEach(function (a) { ax[a.id] = a; });
    var formAxis = ax[R.form.axis.id];
    var top = R.form.top;
    var topNames = top.map(function (f) { return f.name; }).join('+');
    var guardAxis = ax[ax[v.id].pair];
    var sinLeft = (v.kind === 'vice');
    var pairRows = R.pairs.map(function (p, i) {
      var isTop = (v.id === p.sinId || v.id === p.virtueId);
      var L = sinLeft
        ? { ax: p.sin, share: p.sinShare, band: p.sinBand }
        : { ax: p.virtue, share: p.virtueShare, band: p.virtueBand };
      var RR = sinLeft
        ? { ax: p.virtue, share: p.virtueShare, band: p.virtueBand }
        : { ax: p.sin, share: p.sinShare, band: p.sinBand };
      return '<tr class="pairRow ' + (sinLeft ? 'sin-left' : 'virtue-left') + (isTop ? ' isTop' : '') + '" data-sum="' + (p.sinShare + p.virtueShare) + '">'
        + '<td class="pIdx">' + String(i + 1).padStart(2, '0') + '</td>'
        + '<td class="pSide pLeft"><span class="pName">' + esc(L.ax.zh) + '</span><em>' + esc(L.ax.latin) + '</em></td>'
        + '<td class="pVal pValL"><b>' + L.share + '</b><i>' + esc(L.band) + '</i></td>'
        + '<td class="pBarCell"><span class="pBar" role="img" aria-label="' + esc(L.ax.zh) + ' ' + L.share + '，' + esc(RR.ax.zh) + ' ' + RR.share + '">'
        + '<i style="width:' + L.share + '%"></i></span></td>'
        + '<td class="pVal pValR"><b>' + RR.share + '</b><i>' + esc(RR.band) + '</i></td>'
        + '<td class="pSide pRight"><span class="pName">' + esc(RR.ax.zh) + '</span><em>' + esc(RR.ax.latin) + '</em></td>'
        + '</tr>';
    }).join('');

    var specialBanner = '';
    var sp = R.special;
    if (sp.flat) specialBanner = banner('flat');
    else if (sp.low) specialBanner = banner('low');
    else if (sp.high) specialBanner = banner('high');
    if (sp.tie) specialBanner += banner('tie');
    if (sp.ideal) specialBanner += banner('ideal');

    var signals = [];
    R.form.facets.slice(0, 3).forEach(function (f) { signals = signals.concat(f.signals); });
    signals = signals.slice(0, 6);

    var deltaWord = R.delta > 8 ? '罪面比德面高 ' + R.delta + ' 分。'
      : R.delta < -8 ? '德面比罪面高 ' + Math.abs(R.delta) + ' 分。'
      : '两侧几乎持平。';

    var tension = (R.secondAxis.id === ax[v.id].pair) ? ax[v.id].ally : ax[v.id].foreign;

    var blind = R.scenario.blind;
    var blindBanner = (blind === 'blindUp' || blind === 'blindDown') ? banner(blind) : '';

    var practice = v.kind === 'vice' ? SF.PRACTICES[v.id] : SF.PRACTICES[ax[v.id].pair];

    app.innerHTML = ''
      + '<section class="view result">'
      + '  <header class="bar">'
      + '    <a class="barBack" href="#/home" aria-label="回到开头">←</a>'
      + '    <span class="barAct">' + (isDemo ? '例样' : (name ? esc(name) + ' 的判词' : '判词')) + '</span>'
      + '    <span class="barCount"></span>'
      + '  </header>'

      + '  <section class="card verdict">'
      + '    <p class="kicker">' + (v.kind === 'vice' ? '你的主导之罪' : '你的主导之德') + (mode === 'deep' ? ' · 深度探索' : '') + '</p>'
      + '    <h1 class="vName">' + esc(v.zh) + '</h1>'
      + '    <p class="vLatin">' + esc(v.latin) + '</p>'
      + '    <p class="vEssence">' + esc(ax[v.id].essence) + '</p>'
      + '    <p class="vScore"><b>' + v.score + '</b><span>/ 100 · 内部刻度 · ' + esc(v.band) + '</span></p>'
      + '    <div class="vAlt"><span>另一端 · ' + esc(R.secondAxis.zh) + ' <b>' + R.secondAxis.score + '</b></span><span class="vSub">' + esc(ax[v.id].sub) + '</span></div>'
      + (trackTitle ? '    <p class="vTrack">专属曲 · ' + esc(trackTitle) + '</p>' : '')
      + '  </section>'

      + specialBanner

      + '  <section class="card balance">'
      + '    <h2 class="sec">天平 <span>THE BALANCE</span></h2>'
      + balanceSVG(R.delta)
      + '    <div class="beamNums"><div><b>' + R.viceMean + '</b><span>七罪</span></div><div><b>' + R.virtueMean + '</b><span>七德</span></div></div>'
      + '    <p class="note">' + deltaWord + '罪性与德性分开计分，它们不是一条轴的两端。</p>'
      + '  </section>'

      + '  <section class="card chartCard">'
      + '    <h2 class="sec">十四面镜 <span>THE FOURTEEN</span></h2>'
      + chartSVG(R.ranking)
      + '    <p class="note">上半为七宗罪，下半为对应的對治之德。数值是本测验内部刻度，不是人群百分位。</p>'
      + '  </section>'

      + (mode === 'simple' ? formSection(R) : '')

      + '  <section class="card tableCard">'
      + '    <h2 class="sec">十四项刻度 <span>THE SEVEN PAIRS</span></h2>'
      + '    <table class="pairTable"><caption class="sr">七对刻度：每对合计一百</caption>'
      + '      <colgroup><col class="cIdx"><col class="cSide"><col class="cVal"><col class="cBar"><col class="cVal"><col class="cSide"></colgroup>'
      + '      <tbody>' + pairRows + '</tbody></table>'
      + '    <p class="note">每一对的两项合计 100，表示这一对你更靠哪边；绝对强度见上方芒星。</p>'
      + '  </section>'

      + '  <section class="card narrative">'
      + '    <h2 class="sec">解读 <span>READING</span></h2>'
      + ax[v.id].long.map(function (p) { return '<p>' + esc(p) + '</p>'; }).join('')
      + '    <p class="pivotP">你的' + esc(formAxis.zh) + '落在 <b>' + esc(topNames) + '</b> 上。' + esc(top[0].insight) + '</p>'
      + '    <p>' + tension + '</p>'
      + '    <p class="pivotP">另一侧，你的 <b>' + esc(R.secondAxis.zh) + '</b> 也站在前面（' + R.secondAxis.score + '）。' + esc(ax[R.secondAxis.id].essence) + '</p>'
      + '  </section>'

      + (mode === 'deep' ? detailSection(R) + costSection(R) + crossSection(R) + picksSection(R) : '')

      + '  <section class="card signalsCard">'
      + '    <h2 class="sec">日常信号 <span>IN DAILY LIFE</span></h2>'
      + '    <ol class="signals">' + signals.map(function (s) { return '<li>' + esc(s) + '</li>'; }).join('') + '</ol>'
      + '    <p class="note">这些是这一种倾向最常见的落点。对上两三条就够了，全对上的人很少。</p>'
      + '  </section>'

      + blindBanner

      + '  <section class="card guardCard">'
      + '    <h2 class="sec">' + (v.kind === 'vice' ? '守护' : '对侧') + ' <span>' + esc(guardAxis.latin) + '</span></h2>'
      + '    <p class="guardLine"><b>' + esc(guardAxis.zh) + '</b> ' + R.axes[guardAxis.id].score + '　<i>' + esc(R.axes[guardAxis.id].band) + '</i></p>'
      + '    <p>' + (R.secondAxis.id === ax[v.id].pair ? esc(ax[v.id].ally) : esc(ax[v.id].foreign)) + '</p>'
      + '    ' + (practice ? '<div class="practice"><h3>' + esc(practice.title) + '</h3><ol>' + practice.steps.map(function (s) { return '<li>' + esc(s) + '</li>'; }).join('') + '</ol></div>' : '')
      + '  </section>'

      + '  <section class="card shareCard">'
      + '    <h2 class="sec">分享 <span>PASS IT ON</span></h2>'
      + '    <p class="shareLead">链接里只包含你的答案编码，不含名字以外的任何信息。</p>'
      + '    <div class="nameRow"><label for="nameInput">署名（可跳过）</label>'
      + '      <input id="nameInput" maxlength="12" placeholder="比如：阿麦" value="' + esc(name) + '" autocomplete="off">'
      + '      <button class="btnSmall" type="button" data-savename>保存</button></div>'
      + '    <div class="shareBtns">'
      + '      <button class="btn" type="button" data-copy>复制结果链接</button>'
      + '      <button class="btnGhost" type="button" data-card>下载分享卡</button>'
      + '      <button class="btnGhost" type="button" data-native hidden>系统分享</button>'
      + '    </div>'
      + '    <p class="urlLine"><input id="urlBox" readonly value="' + esc(location.href) + '" aria-label="结果链接"></p>'
      + '  </section>'

      + '  <footer class="resFoot">'
      + feedbackRow()
      + '    <p class="tiny">本测验是自我观察工具，不构成心理或医学诊断。<a class="link" href="#/method">方法与来源</a></p>'
      + '    <div class="homeActions"><a class="btnGhost" href="#/restart">重新作答</a><a class="link" href="#/home">回到开头</a></div>'
      + '  </footer>'
      + '</section>';

    animChart();
    animBeam(R.delta);
    var nativeBtn = $('[data-native]');
    if (nativeBtn && navigator.share) nativeBtn.hidden = false;
    window.__SF_RESULT = R;
    if (/[?&]card/.test(location.search)) {
      var host = document.createElement('div');
      host.id = 'cardHost';
      host.className = 'cardHost';
      app.querySelector('.result').insertBefore(host, app.querySelector('.result').firstChild);
      setTimeout(function () { drawCard(true); }, 60);
    }
    focusHead();
  }

  function banner(key) {
    var s = SF.SPECIAL[key];
    if (!s) return '';
    return '<section class="card banner"><h3>' + esc(s.title) + '</h3><p>' + esc(s.body) + '</p></section>';
  }

  /* ───────── 分享卡（Canvas） ───────── */
  function drawCard(preview) {
    var R = window.__SF_RESULT;
    if (!R) return;
    var W = 1080, H = 1350;
    var c = document.createElement('canvas');
    c.width = W; c.height = H;
    var x = c.getContext('2d');
    var serif = '"Noto Serif SC", "Source Han Serif SC", "Songti SC", STSong, serif';
    var latin = '"Cinzel", Georgia, serif';
    var num = '"Cormorant Garamond", Georgia, serif';

    x.fillStyle = '#07070A'; x.fillRect(0, 0, W, H);
    var grad = x.createRadialGradient(W / 2, 380, 60, W / 2, 520, 900);
    grad.addColorStop(0, 'rgba(198,166,100,0.10)');
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = grad; x.fillRect(0, 0, W, H);

    x.strokeStyle = 'rgba(232,227,218,0.14)'; x.lineWidth = 2;
    x.strokeRect(56, 56, W - 112, H - 112);

    x.fillStyle = '#C6A664';
    x.font = '600 26px ' + latin;
    x.textAlign = 'left';
    x.fillText('S E V E N F O L D', 96, 150);

    x.fillStyle = 'rgba(232,227,218,0.55)';
    x.font = '24px ' + serif;
    x.fillText(currentName ? '「' + currentName + '」的判词' : '七重 · 判词', 96, 220);

    var v = R.verdictAxis;
    x.fillStyle = '#E8E3DA';
    x.font = '600 168px ' + serif;
    x.fillText(v.zh, 92, 420);

    x.fillStyle = '#C6A664';
    x.font = '500 34px ' + latin;
    x.fillText(v.latin, 96, 486);

    x.fillStyle = 'rgba(232,227,218,0.86)';
    x.font = '36px ' + serif;
    x.fillText(ax_essence(v.id), 96, 560);

    x.fillStyle = '#E8E3DA';
    x.font = '300 104px ' + num;
    x.fillText(String(v.score), 92, 706);
    x.fillStyle = 'rgba(232,227,218,0.45)';
    x.font = '24px ' + serif;
    x.fillText('/ 100 · 内部刻度 · ' + v.band, 240, 700);

    var fy = 800;
    R.form.facets.forEach(function (f, i) {
      var y = fy + i * 82;
      x.fillStyle = 'rgba(232,227,218,0.92)';
      x.font = '30px ' + serif;
      x.fillText(f.name, 96, y);
      var bx = 300, bw = 480;
      x.fillStyle = 'rgba(232,227,218,0.14)';
      x.fillRect(bx, y - 20, bw, 3);
      x.fillStyle = i === 0 ? '#C6A664' : 'rgba(232,227,218,0.6)';
      x.fillRect(bx, y - 20, bw * (f.value / 4), 3);
      x.fillStyle = 'rgba(232,227,218,0.45)';
      x.font = '22px ' + serif;
      x.textAlign = 'right';
      x.fillText(SF.LEVELS[SF.level(f.value)], 940, y);
      x.textAlign = 'left';
    });

    x.strokeStyle = 'rgba(232,227,218,0.14)';
    x.beginPath(); x.moveTo(96, 1150); x.lineTo(W - 96, 1150); x.stroke();

    x.fillStyle = 'rgba(232,227,218,0.8)';
    x.font = '30px ' + serif;
    x.fillText('七罪 ' + R.viceMean + '　·　七德 ' + R.virtueMean, 96, 1204);

    x.fillStyle = 'rgba(232,227,218,0.35)';
    x.font = '22px ' + serif;
    var u = location.href.split('#')[0].replace(/^file:.*$/, 'sevenfold');
    x.fillText(u.slice(0, 64) + '　·　自我观察工具，非诊断', 96, 1256);

    function ax_essence(id) {
      for (var i = 0; i < SF.AXES.length; i++) if (SF.AXES[i].id === id) return SF.AXES[i].essence;
      return '';
    }

    if (preview) {
      c.className = 'cardPreview';
      var host = document.getElementById('cardHost');
      if (host) { host.innerHTML = ''; host.appendChild(c); }
      return;
    }

    c.toBlob(function (blob) {
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'sevenfold-' + v.latin.toLowerCase() + '.png';
      document.body.appendChild(a);
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      toast('分享卡已下载');
    }, 'image/png');
  }

  /* ───────── 事件 ───────── */
  app.addEventListener('click', function (e) {
    if (e.target.closest('[data-back]')) { back(); return; }
    if (e.target.closest('[data-copy]')) {
      var url = location.href;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(function () { toast('链接已复制'); },
          function () { fallbackCopy(); });
      } else fallbackCopy();
      function fallbackCopy() {
        var box = document.getElementById('urlBox');
        if (box) { box.focus(); box.select(); try { document.execCommand('copy'); toast('链接已复制'); } catch (err) { toast('请手动复制下方链接'); } }
      }
      return;
    }
    if (e.target.closest('[data-card]')) { drawCard(); return; }
    if (e.target.closest('[data-native]')) {
      navigator.share({ title: '七重 · 七宗罪与七美德', text: '我的判词：' + (window.__SF_RESULT ? window.__SF_RESULT.verdictAxis.zh : ''), url: location.href }).catch(function () {});
      return;
    }
    if (e.target.closest('[data-savename]')) {
      var inp = document.getElementById('nameInput');
      var v = (inp && inp.value || '').trim().slice(0, 12);
      state.name = v;
      try { localStorage.setItem(STORE + '.name', v); } catch (err) {}
      var payload = location.hash.split('&')[0].replace('#/r/', '');
      location.hash = '#/r/' + payload + (v ? '&n=' + SF.codec.encodeName(v) : '');
      toast(v ? '署名已加入链接' : '已清除署名');
      return;
    }
  });

  app.addEventListener('change', function (e) {
    if (e.target && e.target.name === 'ans') choose(+e.target.value);
  });

  bindFeedback();

  /* 封面「开始」：这一次点击同时负责进门与起播 */
  document.addEventListener('click', function (e) {
    var el = e.target && e.target.closest ? e.target.closest('[data-start]') : null;
    if (el && SF.music && SF.music.start) SF.music.start();
  });

  document.addEventListener('keydown', function (e) {
    if (e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName) && e.target.type === 'text') return;
    if (document.getElementById('nameInput') && e.target === document.getElementById('nameInput')) return;
    var view = app.getAttribute('data-view');
    if (view !== 'test') return;
    var item = order()[state.index];
    if (!item) return;
    if ((e.key >= '1' && e.key <= '5') || (e.key >= 'a' && e.key <= 'd')) {
      var n = e.key >= '1' && e.key <= '5' ? (+e.key - 1) : (e.key.toLowerCase().charCodeAt(0) - 97);
      if (item.kind === 'facet' && n <= 4) { e.preventDefault(); choose(n); }
      if (item.kind === 'scenario' && n <= 3) { e.preventDefault(); choose(n); }
    }
    if (e.key === 'ArrowLeft' || e.key === 'Backspace') { e.preventDefault(); back(); }
  });

  window.addEventListener('hashchange', route);

  function focusHead() {
    var h = app.querySelector('h1, h2');
    if (h) {
      h.setAttribute('tabindex', '-1');
      try { h.focus({ preventScroll: true }); } catch (e) {}
    }
    app.setAttribute('data-view', parseHash().view);
  }

  /* ───────── 启动 ───────── */
  SF.toast = toast;
  load();
  try { state.name = localStorage.getItem(STORE + '.name') || state.name; } catch (e) {}
  var r = parseHash();
  if (r.view === 'test') {
    if (isComplete()) {
      location.replace('#/');
    } else if (!answeredCount() && state.index > 0) {
      state.index = 0;
    }
  }
  if (SF.music) SF.music.boot();
  route();
})();

</script>
</body>
</html>
